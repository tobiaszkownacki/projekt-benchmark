name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ruff check
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.4"
          args: "check ."

      - name: Run ruff format check
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.4"
          args: "format --check ."
