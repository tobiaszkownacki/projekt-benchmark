[flake8]
max-line-length = 120
# flake8 has no "include" option; the key that used to be here was silently
# ignored. Scope is controlled by exclusion instead.
extend-exclude =
    .git,
    .venv,
    .venv-tools,
    __pycache__,
    build,
    dist,
    node_modules,
    src/web/frontend,
    reports,
    downloads,
    weights,
    data

[tool:pytest]
addopts = --disable-warnings -q
testpaths =
    src/web/tests
