services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/db_schemas:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./config/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
      - ./config/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SESSION_SECRET: ${SESSION_SECRET}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
      PUBLIC_RESULTS: ${PUBLIC_RESULTS:-1}
      DAILY_SUBMISSION_LIMIT: ${DAILY_SUBMISSION_LIMIT:-3}
      VALIDATOR_ENABLED: ${VALIDATOR_ENABLED:-0}
    ports:
      - "${WEB_PORT:-8080}:8000"
    volumes:
      - ./downloads:/downloads:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  outbox_publisher:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RABBITMQ_HOST: rabbitmq
      # .env carries the port published on the host; inside the network the
      # broker is always on 5672. Inheriting the published one dials nothing.
      RABBITMQ_PORT: 5672
    command: ["python", "-m", "backend.outbox_publisher"]
    # Both services share one image whose healthcheck probes the HTTP endpoint.
    # This one serves nothing, so it checks that the process is alive instead.
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; p='/tmp/outbox-heartbeat'; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p) < 60 else 1)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: ${PIPELINE_DOCKERFILE:-src/pipeline/Dockerfile}
    command: ["worker"]
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      EXECUTOR: ${EXECUTOR:-athena}
      # As above: in-network ports, not the ones published on the host.
      POSTGRES_PORT: 5432
      RABBITMQ_PORT: 5672
    volumes:
      - executor_workspace:/var/lib/executor-workspace

  poller:
    build:
      context: .
      dockerfile: ${PIPELINE_DOCKERFILE:-src/pipeline/Dockerfile}
    command: ["poller"]
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      EXECUTOR: ${EXECUTOR:-athena}
      POSTGRES_PORT: 5432
      RABBITMQ_PORT: 5672
    volumes:
      - executor_workspace:/var/lib/executor-workspace

  downloader:
    build:
      context: .
      dockerfile: ${PIPELINE_DOCKERFILE:-src/pipeline/Dockerfile}
    command: ["downloader"]
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      EXECUTOR: ${EXECUTOR:-athena}
      POSTGRES_PORT: 5432
      RABBITMQ_PORT: 5672
    volumes:
      - ./downloads:/downloads
      - executor_workspace:/var/lib/executor-workspace

volumes:
  postgres_data:
  rabbitmq_data:
  # Where an executor stages a job before it runs. One that submits to a cluster
  # stages there and leaves this empty; one that runs here needs worker, poller
  # and downloader to see the same directory.
  executor_workspace:
