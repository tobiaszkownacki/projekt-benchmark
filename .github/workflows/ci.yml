name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      # Only the lint tooling. The project's runtime dependencies include torch,
      # torchvision and a CUDA 13 build of CuPy; installing those in order to run
      # a linter costs minutes and is a reliable source of timeouts.
      - name: Install lint tooling
        run: uv sync --only-group ci

      # Fails on new violations only. The repository carries 160 pre-existing
      # ones, recorded in .flake8-baseline: repairing the install step made them
      # visible for the first time, they belong to modules owned by other
      # people, and neither hiding them nor leaving the build red is useful.
      - name: Run flake8
        run: uv run python scripts/lint_baseline.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install web layer with test tooling
        working-directory: src/web
        run: uv sync --group dev

      - name: Run pytest
        working-directory: src/web
        run: uv run pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/web/frontend/package-lock.json

      - name: Install
        working-directory: src/web/frontend
        run: npm ci

      - name: Lint
        working-directory: src/web/frontend
        run: npm run lint

      # §14 bans gradients, glassmorphism and heavy shadows. A ban nobody
      # enforces stops being a ban by the third pull request, so it is grepped.
      - name: Check visual constraints
        working-directory: src/web/frontend
        run: npm run lint:css

      - name: Build
        working-directory: src/web/frontend
        run: npm run build
