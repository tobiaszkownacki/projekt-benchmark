[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "projekt-benchmark"
version = "0.1.0"
description = "Benchmark comparing gradient-based and gradient-free optimizers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.24",
    "cupy-cuda12x>=14.0.1",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "cma>=3.3",
    "tqdm>=4.65",
    "python-dotenv>=1.0",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "paramiko>=5.0.0",
]

[dependency-groups]
task-queue = [
    "paramiko>=5.0.0",
    "pika>=1.4.4",
    "psycopg[binary]>=3.3.4",
]
# Linting and test tooling. Deliberately a dependency group rather than an
# optional extra: these are development dependencies, not an opt-in feature of
# the package, and the repository already uses groups for the Athena services.
ci = [
    "pytest>=8",
]
# What tools/local_backend/seed.py needs beyond the root ML stack: a database
# driver and password hashing for the dev accounts it creates.
local-seed = [
    "bcrypt>=4.1",
    "psycopg[binary]>=3.3.4",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    "reports",
    "data",
    "weights",
    "downloads",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "C4",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Depends(), Query() and Path() in a signature default are how FastAPI declares
# dependencies; B008 flags every one of them.
"src/web/app/routers/*.py" = ["B008"]
"src/web/app/security.py" = ["B008"]
# Imported for its side effect: populates the INFRASTRUCTURES registry.
"src/pipeline/pipeline_builder.py" = ["F401"]
