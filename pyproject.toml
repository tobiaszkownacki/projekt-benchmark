[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "projekt-benchmark"
version = "0.1.0"
description = "Benchmark comparing gradient-based and gradient-free optimizers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.24",
    "cupy-cuda12x>=14.0.1",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "cma>=3.3",
    "tqdm>=4.65",
    "python-dotenv>=1.0",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "paramiko>=5.0.0",
]

[dependency-groups]
api-fastapi = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.0",
    "pika>=1.4.4",
    "psycopg[binary]>=3.3.4",
]
# Worker, poller and downloader share one image, so they share one group. The
# SSH client is here because every executor that submits to a computing centre
# reaches it that way.
pipeline = [
    "paramiko>=5.0.0",
    "pika>=1.4.4",
    "psycopg[binary]>=3.3.4",
]
# Linting and test tooling. Deliberately a dependency group rather than an
# optional extra: these are development dependencies, not an opt-in feature of
# the package, and the repository already uses groups for the Athena services.
ci = [
    "flake8>=7",
    "pytest>=8",
]
# What `tools/local_backend/seed.py` needs on top of the root dependencies: it
# drives the real evaluator and the real NumPy optimizers, then writes straight
# to Postgres with SQL. It used to borrow the Streamlit group for these two,
# which stopped making sense when Streamlit was removed.
seed = [
    "bcrypt>=4.1",
    "psycopg[binary]>=3.1",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    "reports",
    "data",
    "weights",
    "downloads",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "C4",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Depends(), Query() and Path() in a signature default are how FastAPI declares
# dependencies; B008 flags every one of them.
"src/backend/routers/*.py" = ["B008"]
"src/backend/security.py" = ["B008"]
# The sys.path bootstrap has to run before the engine imports.
"tools/local_backend/runner.py" = ["E402"]
"tools/local_backend/run_job.py" = ["E402"]
