name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      # Only the lint tooling. The project's runtime dependencies include torch,
      # torchvision and a CUDA 13 build of CuPy; installing those in order to run
      # a linter costs minutes and is a reliable source of timeouts.
      - name: Install lint tooling
        run: uv sync --only-group ci

      # Fails on new violations only. Pre-existing ones are recorded in
      # .flake8-baseline.
      - name: Run flake8
        run: uv run python scripts/lint_baseline.py

  test:
    runs-on: ubuntu-latest

    # Thirty of the tests skip themselves without TEST_DATABASE_URL, including
    # the SPA catch-all and the authorisation boundary on artifacts. A database
    # is needed here or the job passes without running them.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: benchmark_user
          POSTGRES_PASSWORD: benchmark_ci
          POSTGRES_DB: benchmark_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U benchmark_user -d benchmark_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://benchmark_user:benchmark_ci@127.0.0.1:5432/benchmark_ci
      # The schema is built by the application's own forward-only runner rather
      # than by piping the files into psql, so a migration that cannot be
      # applied fails the suite instead of passing unnoticed.
      RUN_MIGRATIONS: "1"
      MIGRATIONS_DIR: ../db/migrations

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install web layer with test tooling
        working-directory: src/web
        run: uv sync --group dev

      - name: Run pytest
        working-directory: src/web
        run: uv run pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/web/frontend/package-lock.json

      - name: Install
        working-directory: src/web/frontend
        run: npm ci

      - name: Lint
        working-directory: src/web/frontend
        run: npm run lint

      # Enforced in CI so the rule does not erode over time.
      - name: Check visual constraints
        working-directory: src/web/frontend
        run: npm run lint:css

      - name: Build
        working-directory: src/web/frontend
        run: npm run build
