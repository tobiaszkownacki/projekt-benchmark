services:
  postgres:
    image: postgres:16-alpine
    container_name: benchmark_frontend_db
    restart: unless-stopped
    env_file: .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: benchmark_frontend_rabbitmq
    restart: unless-stopped
    env_file: .env
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  athena_worker:
    build:
      context: .
      dockerfile: src/pipeline/Dockerfile
    command: ["worker"]
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      EXECUTOR: athena

  athena_poller:
    build:
      context: .
      dockerfile: src/pipeline/Dockerfile
    command: ["poller"]
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      EXECUTOR: athena

  athena_downloader:
    build:
      context: .
      dockerfile: src/pipeline/Dockerfile
    command: ["downloader"]
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      EXECUTOR: athena
    volumes:
      - ./downloads:/downloads

  validator_image:
    build:
      context: .
      dockerfile: Dockerfile.validator
    image: ${VALIDATOR_IMAGE:-benchmark-validator:latest}
    entrypoint: ["/bin/true"]
    restart: "no"

  web:
    build:
      context: .
      dockerfile: src/web/Dockerfile
    container_name: benchmark_web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      validator_image:
        condition: service_completed_successfully
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SESSION_SECRET: ${SESSION_SECRET}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
      # Names the queue a submission is written for, and has to match the
      # pipeline services above.
      EXECUTOR: athena
      PUBLIC_RESULTS: ${PUBLIC_RESULTS:-1}
      DAILY_SUBMISSION_LIMIT: ${DAILY_SUBMISSION_LIMIT:-3}
      VALIDATOR_ENABLED: ${VALIDATOR_ENABLED:-1}
      VALIDATOR_IMAGE: ${VALIDATOR_IMAGE:-benchmark-validator:latest}
    ports:
      # 8080, not 8000: main's task API claims ${API_PORT:-8000} and the two
      # would refuse to bind together on a default `docker compose up`.
      - "${WEB_PORT:-8080}:8000"
    volumes:
      # Read-only on purpose. The downloader owns this directory; the web layer
      # only reads it, and defence in depth means a bug here cannot write into
      # the artifact tree.
      - ./downloads:/downloads:ro
      # The API starts a fresh, restricted validator container for every
      # uploaded optimizer. Set VALIDATOR_ENABLED=0 to deploy without it.
      - /var/run/docker.sock:/var/run/docker.sock
    # Docker Desktop exposes the socket to group 0. Native Linux deployments
    # can set DOCKER_GID to the host's Docker group id.
    group_add:
      - "${DOCKER_GID:-0}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  outbox_publisher:
    build:
      context: .
      dockerfile: src/web/Dockerfile
    container_name: benchmark_outbox_publisher
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RABBITMQ_HOST: rabbitmq
      # Decides which queues this process declares and drains, and has to match
      # the pipeline services above.
      EXECUTOR: athena
    command: ["python", "-m", "app.outbox_publisher"]
    # Both services share one image whose healthcheck probes the HTTP endpoint.
    # This one serves nothing, so it checks that the process is alive instead.
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; p='/tmp/outbox-heartbeat'; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p) < 60 else 1)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
  rabbitmq_data:
