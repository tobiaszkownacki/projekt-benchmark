[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "projekt-benchmark"
version = "0.1.0"
description = "Benchmark comparing gradient-based and gradient-free optimizers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.24",
    "cupy-cuda13x>=14.0.1",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "cma>=3.3",
    "tqdm>=4.65",
    "python-dotenv>=1.0",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "paramiko>=5.0.0",
]

[dependency-groups]
# Linting and test tooling. Deliberately a dependency group rather than an
# optional extra: these are development dependencies, not an opt-in feature of
# the package, and the repository already uses groups for the Athena services.
ci = [
    "flake8>=7",
    "pytest>=8",
]

athena-downloader = [
    "paramiko>=5.0.0",
    "pika>=1.4.4",
    "psycopg[binary]>=3.3.4",
]
athena-poller = [
    "paramiko>=5.0.0",
    "pika>=1.4.4",
    "psycopg[binary]>=3.3.4",
]
athena-worker = [
    "paramiko>=5.0.0",
    "pika>=1.4.4",
    "psycopg[binary]>=3.3.4",
]
