[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "projekt-benchmark-web"
version = "0.1.0"
description = "Control plane and web layer for the black-box optimizer benchmark"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary,pool]>=3.2",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.12",
    "bcrypt>=4.1",
    "httpx>=0.27",
    "authlib>=1.3",
    "pika>=1.3",
    "email-validator>=2.1",
]

[tool.setuptools]
packages = ["app", "app.routers", "app.services"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "flake8>=7",
]
